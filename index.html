<!DOCTYPE html>
<html lang="en">
<head>
<meta charsaet="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Alpha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Sora:wght@300;400;500&family=Luckiest+Guy&display=swap" rel="stylesheet">
<link rel="preload" as="video" href="https://raw.githubusercontent.com/mdimrankhanalpha/Profile/main/background.mp4">
<style>
  :root{
    --black:#040404;
    --black-2:#0a0a0a;
    --white:#f2f2f2;
    --white-dim:#9a9a9a;
    --red:#ff2d2d;
    --red-dim:#7a1414;
    --glass:rgba(255,255,255,0.035);
    --glass-border:rgba(255,255,255,0.09);
    --item-h:84px;
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;width:100%;min-height:100%;
    background:var(--black);
    color:var(--white);
    font-family:'Sora',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  /* ---------- background video ---------- */
  #bg-video{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    height:100dvh; /* fixes mobile browser URL-bar resize jumps */
    z-index:0;
    object-fit:cover;
    object-position:center center;
    background:var(--black);
    pointer-events:none;
    opacity:0;
    transition:opacity .5s ease;
    /* promote to its own GPU compositor layer so decoding never
       competes with scroll/hover work on the main thread */
    transform:translateZ(0);
    will-change:opacity;
    backface-visibility:hidden;
    isolation:isolate;
    contain:strict;
  }
  #bg-video.loaded{opacity:1;}

  /* ---------- intro ---------- */
  #intro{
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    background:#000;
    opacity:1;
    transition:opacity .4s ease;
  }
  #intro.fade-out{opacity:0; pointer-events:none;}

  #intro-particles{
    position:absolute; inset:0; overflow:hidden; pointer-events:none;
  }
  #intro-particles .particle{
    position:absolute; width:2px; height:2px; border-radius:50%;
    background:var(--white); opacity:0;
    animation-name:driftParticle; animation-timing-function:ease-in-out; animation-iteration-count:infinite;
    will-change:transform,opacity;
  }
  @keyframes driftParticle{
    0%{opacity:0; transform:translateY(0);}
    50%{opacity:.6;}
    100%{opacity:0; transform:translateY(-40px);}
  }

  #intro-emblem-wrap{
    position:relative; width:min(46vw,220px); height:min(46vw,220px);
    opacity:0; transform:scale(.7);
  }
  #intro.animating #intro-emblem-wrap{
    animation:emblemIntro 3s ease forwards;
  }
  #intro.reduced #intro-emblem-wrap{
    opacity:1; transform:scale(1);
  }
  @keyframes emblemIntro{
    0%{opacity:0; transform:scale(.6);}
    10%{opacity:1; transform:scale(1);}
    27%{opacity:1; transform:scale(1);}
    76%{opacity:1; transform:scale(1.04); filter:drop-shadow(0 0 26px rgba(255,45,45,.55));}
    100%{opacity:0; transform:scale(1.5); filter:drop-shadow(0 0 0 rgba(255,45,45,0));}
  }
  #intro.animating #intro-emblem-wrap .emblem-svg{
    animation:emblemPulse 1.5s ease-in-out infinite;
  }
  @keyframes emblemPulse{
    0%,100%{filter:drop-shadow(0 0 6px rgba(255,45,45,.35));}
    50%{filter:drop-shadow(0 0 22px rgba(255,45,45,.75));}
  }

  #skip-btn{
    position:absolute; right:20px; bottom:max(20px, env(safe-area-inset-bottom));
    background:transparent; border:1px solid var(--glass-border); color:var(--white-dim);
    font-family:'Sora',sans-serif; font-size:12px; letter-spacing:.12em; text-transform:uppercase;
    padding:10px 16px; border-radius:999px; cursor:pointer;
    transition:opacity .25s ease, border-color .25s ease, color .25s ease;
    opacity:.7;
  }
  #skip-btn:hover, #skip-btn:focus-visible{
    opacity:1; border-color:var(--red); color:var(--white);
  }
  #intro.reduced #skip-btn{opacity:.5;}

  /* ---------- app ---------- */
  #app{
    position:relative; z-index:1; min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding:calc(env(safe-area-inset-top) + 32px) 16px calc(env(safe-area-inset-bottom) + 32px);
  }
  #app[aria-hidden="true"]{visibility:hidden;}

  #profile-list{
    list-style:none; margin:0; padding:0;
    width:100%; max-width:520px;
    display:flex; flex-direction:column; gap:14px;
  }

  .profile-li{width:100%;}

  .profile-item{
    --mx:50%; --my:50%;
    position:relative;
    display:flex; align-items:center; gap:14px;
    width:100%; min-height:64px;
    padding:12px 18px 12px 12px;
    border-radius:20px;
    text-decoration:none; color:var(--white);
    background:
      radial-gradient(220px circle at var(--mx) var(--my), rgba(255,45,45,0.16), transparent 70%),
      linear-gradient(155deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
    border:1px solid var(--glass-border);
    box-shadow:0 10px 26px rgba(0,0,0,0.45);
    transform:translateZ(0) scale(1);
    transition:transform .28s cubic-bezier(.2,.8,.2,1), box-shadow .28s ease, border-color .28s ease;
    will-change:transform;
    -webkit-tap-highlight-color:transparent;
  }
  .profile-item:hover{
    transform:translateY(-2px) scale(1.012);
    border-color:rgba(255,45,45,0.35);
    box-shadow:0 16px 34px rgba(0,0,0,.55), 0 0 22px rgba(255,45,45,.08);
  }
  .profile-item.pressed{
    transform:scale(.97);
  }
  .profile-item:focus-visible{
    outline:2px solid var(--red); outline-offset:3px;
  }

  .avatar{
    position:relative; flex:0 0 auto;
    width:48px; height:48px; border-radius:50%;
    overflow:hidden; background:#111;
    border:1px solid rgba(255,255,255,0.12);
    transition:border-color .28s ease, box-shadow .28s ease;
  }
  .profile-item:hover .avatar, .profile-item:focus-visible .avatar{
    border-color:var(--red);
    box-shadow:0 0 14px rgba(255,45,45,.55);
  }
  .avatar img{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .avatar .emblem-svg{width:100%; height:100%; display:block;}

  .profile-text{
    flex:1 1 auto; min-width:0;
    display:flex; flex-direction:column; gap:2px;
  }

  .profile-name{
    font-family:'Syne',sans-serif; font-weight:700;
    font-size:17px; letter-spacing:.01em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  /* engineer / diploma-style role badge — only rendered for profiles
     that define a `role`, e.g. "Diploma Engineer" */
  .profile-role{
    display:flex; align-items:center; gap:6px;
    font-family:'Sora',sans-serif; font-weight:500;
    font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
    color:#8fa8b8;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .profile-role::before{
    content:'';
    flex:0 0 auto;
    width:6px; height:6px;
    border:1px solid currentColor;
    transform:rotate(45deg);
  }

  /* ---------- Clash of Clans theme (scoped to .theme-coc only) ---------- */
  .profile-item.theme-coc{
    --coc-gold:#ffd469;
    --coc-gold-dark:#a8721a;
    --coc-brown:#3a2210;
    background:
      radial-gradient(220px circle at var(--mx) var(--my), rgba(255,180,40,0.16), transparent 70%),
      linear-gradient(155deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
    border:1px solid rgba(255,180,40,0.3);
  }
  .profile-item.theme-coc:hover{
    border-color:rgba(255,180,40,0.55);
    box-shadow:0 16px 34px rgba(0,0,0,.55), 0 0 22px rgba(255,180,40,.1);
  }
  .profile-item.theme-coc .avatar{
    border:1px solid rgba(255,180,40,0.35);
  }
  .profile-item.theme-coc:hover .avatar,
  .profile-item.theme-coc:focus-visible .avatar{
    border-color:var(--coc-gold);
    box-shadow:0 0 14px rgba(255,180,40,.55);
  }
  .profile-item.theme-coc .profile-name{
    font-family:'Luckiest Guy',cursive;
    font-weight:400;
    letter-spacing:.02em;
    font-size:18px;
    color:var(--coc-gold);
    -webkit-text-stroke:.6px var(--coc-brown);
    text-shadow:0 2px 0 var(--coc-brown), 0 0 10px rgba(255,180,40,.35);
  }
  .profile-item.theme-coc .chevron{
    color:var(--coc-gold-dark);
  }
  .profile-item.theme-coc:hover .chevron,
  .profile-item.theme-coc:focus-visible .chevron{
    color:var(--coc-gold);
  }

  /* ---------- optional background video layer (opt-in per profile) ---------- */
  .profile-item.has-bg-video{ overflow:hidden; }
  .profile-item .card-bg-video{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    z-index:0;
    opacity:.5;
    pointer-events:none;
  }
  .profile-item.has-bg-video::after{
    content:'';
    position:absolute; inset:0; z-index:0;
    background:linear-gradient(155deg, rgba(4,10,26,.62), rgba(4,10,26,.4));
  }
  .profile-item .avatar,
  .profile-item .profile-text,
  .profile-item .chevron{
    position:relative; z-index:1;
  }

  /* ---------- Gojo theme (scoped to .theme-gojo only) — icy electric blue ---------- */
  .profile-item.theme-gojo{
    --gojo-blue:#5fd7ff;
    --gojo-blue-deep:#1c6fa8;
    background:
      radial-gradient(220px circle at var(--mx) var(--my), rgba(95,215,255,0.2), transparent 70%),
      linear-gradient(155deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
    border:1px solid rgba(95,215,255,0.32);
  }
  .profile-item.theme-gojo:hover{
    border-color:rgba(95,215,255,0.6);
    box-shadow:0 16px 34px rgba(0,0,0,.55), 0 0 24px rgba(95,215,255,.18);
  }
  .profile-item.theme-gojo .avatar{
    border:1px solid rgba(95,215,255,0.4);
  }
  .profile-item.theme-gojo:hover .avatar,
  .profile-item.theme-gojo:focus-visible .avatar{
    border-color:var(--gojo-blue);
    box-shadow:0 0 16px rgba(95,215,255,.65);
  }
  .profile-item.theme-gojo .profile-name{
    color:var(--gojo-blue);
    text-shadow:0 0 8px rgba(95,215,255,.55), 0 0 18px rgba(95,215,255,.3);
  }
  .profile-item.theme-gojo .chevron{
    color:var(--gojo-blue-deep);
  }
  .profile-item.theme-gojo:hover .chevron,
  .profile-item.theme-gojo:focus-visible .chevron{
    color:var(--gojo-blue);
  }

  /* ---------- Black Knight theme (scoped to .theme-blackknight only) — pure black & white ---------- */
  .profile-item.theme-blackknight{
    background:
      radial-gradient(220px circle at var(--mx) var(--my), rgba(255,255,255,0.14), transparent 70%),
      linear-gradient(155deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
    border:1px solid rgba(255,255,255,0.28);
  }
  .profile-item.theme-blackknight:hover{
    border-color:rgba(255,255,255,0.55);
    box-shadow:0 16px 34px rgba(0,0,0,.55), 0 0 22px rgba(255,255,255,.14);
  }
  .profile-item.theme-blackknight .avatar{
    border:1px solid rgba(255,255,255,0.35);
    filter:grayscale(1) contrast(1.1);
  }
  .profile-item.theme-blackknight:hover .avatar,
  .profile-item.theme-blackknight:focus-visible .avatar{
    border-color:#fff;
    box-shadow:0 0 14px rgba(255,255,255,.5);
  }
  .profile-item.theme-blackknight .profile-name{
    color:#f2f2f2;
    text-shadow:0 0 10px rgba(255,255,255,.3);
  }
  .profile-item.theme-blackknight .chevron{
    color:#888;
  }
  .profile-item.theme-blackknight:hover .chevron,
  .profile-item.theme-blackknight:focus-visible .chevron{
    color:#fff;
  }

  .chevron{
    flex:0 0 auto; font-size:22px; line-height:1;
    color:var(--white-dim);
    transform:translateX(0);
    transition:transform .28s cubic-bezier(.2,.8,.2,1), color .28s ease, opacity .28s ease;
  }
  .profile-item:hover .chevron, .profile-item:focus-visible .chevron{
    transform:translateX(4px); color:var(--red);
  }

  /* ---------- emblem (shared, cloned via template) ---------- */
  .emblem-svg{width:100%;height:100%;}
  .emblem-fill{fill:#050505;}
  .emblem-stroke{fill:none; stroke:var(--white); stroke-width:1.1; stroke-linejoin:round;}
  .emblem-eye{fill:url(#eyeGlow);}

  @media (prefers-reduced-motion: reduce){
    #intro-emblem-wrap .emblem-svg{animation:none !important;}
  }

  ::selection{background:var(--red); color:#000;}
</style>
</head>
<body>

<video id="bg-video" src="https://raw.githubusercontent.com/mdimrankhanalpha/Profile/main/background.mp4" aria-hidden="true" autoplay muted loop playsinline preload="auto"></video>

<!-- shared SVG defs: referenced by every cloned emblem, defined exactly once -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff5b5b"/>
      <stop offset="45%" stop-color="#ff1f1f"/>
      <stop offset="100%" stop-color="#5a0000" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>

<div id="intro" role="presentation">
  <div id="intro-particles"></div>
  <div id="intro-emblem-wrap"></div>
  <button id="skip-btn" type="button" aria-label="Skip intro">Skip</button>
</div>

<main id="app" aria-hidden="true">
  <ul id="profile-list" role="list" aria-label="Profiles"></ul>
</main>

<!-- procedural three-headed emblem, defined once, cloned everywhere via mountEmblem() -->
<template id="emblem-template">
  <svg class="emblem-svg" viewBox="0 0 200 200" role="img" aria-label="Alpha emblem">
    <!-- collar / body -->
    <polygon class="emblem-fill" points="62,108 100,96 138,108 150,150 100,178 50,150"></polygon>
    <polygon class="emblem-stroke" points="62,108 100,96 138,108 150,150 100,178 50,150"></polygon>

    <!-- left head -->
    <polygon class="emblem-fill" points="30,78 52,58 66,66 68,92 54,108 34,102"></polygon>
    <polygon class="emblem-stroke" points="30,78 52,58 66,66 68,92 54,108 34,102"></polygon>
    <circle class="emblem-eye" cx="47" cy="80" r="4"></circle>

    <!-- right head (mirrored) -->
    <polygon class="emblem-fill" points="170,78 148,58 134,66 132,92 146,108 166,102"></polygon>
    <polygon class="emblem-stroke" points="170,78 148,58 134,66 132,92 146,108 166,102"></polygon>
    <circle class="emblem-eye" cx="153" cy="80" r="4"></circle>

    <!-- center / dominant head -->
    <polygon class="emblem-fill" points="100,18 130,42 136,72 124,98 100,112 76,98 64,72 70,42"></polygon>
    <polygon class="emblem-stroke" points="100,18 130,42 136,72 124,98 100,112 76,98 64,72 70,42"></polygon>
    <circle class="emblem-eye" cx="87" cy="66" r="5.5"></circle>
    <circle class="emblem-eye" cx="113" cy="66" r="5.5"></circle>
    <polygon class="emblem-stroke" points="100,18 100,112"></polygon>
  </svg>
</template>

<script>
(function(){
  "use strict";

  /* =========================================================
     0. DATA SOURCE — the ONLY place profile data is declared.
     Adding profile #2, #3, ... #N requires nothing more than
     pushing objects onto this array, or swapping the source
     entirely via setDataSource(). Nothing below this section
     ever needs to change to support 1 profile or a trillion.
     ========================================================= */
  var profiles = [
    {
      id: "alpha",
      name: "Alpha",
      image: "https://raw.githubusercontent.com/mdimrankhanalpha/Alpha/main/file_0000000012b081fa9718ddb092393a0e.png",
      url: "https://mdimrankhanalpha.github.io/Alpha/"
    },
    {
      id: "tde-alpha",
      name: "TDE Alpha",
      role: "Diploma Engineer",
      image: "https://raw.githubusercontent.com/uuhjeike/TDE-Alpha/main/FB_IMG_1789464542803.jpg",
      url: "https://uuhjeike.github.io/TDE-Alpha/"
    },
    {
      id: "clash-of-clans",
      name: "Clash of Clans",
      theme: "coc",
      image: "https://raw.githubusercontent.com/uuhjeike/Clash-of-Clans/main/profile%20photo.png",
      url: "https://uuhjeike.github.io/Clash-of-Clans/"
    },
    {
      id: "brave",
      name: "Brave",
      image: "https://raw.githubusercontent.com/uuhjeike/Brave/main/profile%20photo.jpg",
      url: "https://uuhjeike.github.io/Brave/"
    },
    {
      id: "lucian-vale",
      name: "Lucian Vale",
      image: "https://raw.githubusercontent.com/uuhjeike/Lucian-Vale/main/profile%20photo.jpg",
      url: "https://uuhjeike.github.io/Lucian-Vale-2/"
    },
    {
      id: "shadowignis",
      name: "ShadowIgnis",
      image: "https://raw.githubusercontent.com/uuhjeike/ShadowIgnis/main/b24825560455f51aad495d5420fd6023.jpg",
      url: "https://uuhjeike.github.io/ShadowIgnis/"
    },
    {
      id: "gojo-back",
      name: "Gojo Back",
      image: "https://raw.githubusercontent.com/uuhjeike/Gojo-Back/main/file_000000006f5482309020dd84155307a5.png",
      url: "https://uuhjeike.github.io/Gojo-Back/",
      theme: "gojo",
      video: "https://raw.githubusercontent.com/uuhjeike/Gojo-Back/main/6efa14de8ffe4c2358cb0ae55dc5785e_720w.mp4"
    },
    {
      id: "black-knight",
      name: "Black Knight",
      image: "https://raw.githubusercontent.com/uuhjeike/Black-Knight/main/profile%20photo.jpg",
      url: "https://uuhjeike.github.io/Black-Knight/",
      theme: "blackknight"
    }
  ];

  var dataSource = {
    length: function(){ return profiles.length; },
    get: function(i){ return profiles[i]; }
  };

  function setDataSource(src){
    dataSource = src;
    lastRange = [-1,-1];
    renderList(true);
  }
  window.setDataSource = setDataSource; // exposed for future paginated/streamed sources

  /* =========================================================
     1. CONFIG — single source of truth for all timing/tiers
     ========================================================= */
  var CONFIG = {
    loopDuration: 46,
    timeline: {
      voidPhase:      [0, 5],
      formation:      [5, 12],
      approach:       [12, 27],
      megaHold:       [27, 30],
      blackHoleBirth: [30, 33],
      consumption:    [33, 40],
      collapse:       [40, 43],
      destruction:    [43, 44],
      darkness:       [44, 46]
    },
    buffer: 8
  };

  var PERF_TIERS = {
    HIGH:   { galaxyStars: 7000, galaxyDust: 2600, galaxyDustLane: 1600, starfield: 3000, debris: 1200, dpr: 2 },
    MEDIUM: { galaxyStars: 3400, galaxyDust: 1300, galaxyDustLane: 800,  starfield: 1500, debris: 600, dpr: 1.5 },
    LOW:    { galaxyStars: 1300, galaxyDust: 500,  galaxyDustLane: 320,  starfield: 600, debris: 250, dpr: 1 }
  };

  function detectTier(){
    var mem = navigator.deviceMemory || 4;
    var cores = navigator.hardwareConcurrency || 4;
    var w = window.innerWidth;
    if (mem <= 2 || cores <= 2 || w < 480) return 'LOW';
    if (mem <= 4 || cores <= 4 || w < 900) return 'MEDIUM';
    return 'HIGH';
  }

  var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* =========================================================
     1b. BACKGROUND VIDEO — reveal once it can play smoothly so
     there's no flash of a black/blank frame; a timeout
     guarantees it still shows even on a slow connection.
     ========================================================= */
  (function(){
    var bgVideo = document.getElementById('bg-video');
    if (!bgVideo) return;
    var revealed = false;
    function reveal(){
      if (revealed) return;
      revealed = true;
      bgVideo.classList.add('loaded');
    }
    if (bgVideo.readyState >= 3){
      reveal();
    } else {
      bgVideo.addEventListener('canplay', reveal);
      bgVideo.addEventListener('loadeddata', reveal);
      bgVideo.addEventListener('error', reveal);
    }
    setTimeout(reveal, 3000);
    var playPromise = bgVideo.play();
    if (playPromise && typeof playPromise.catch === 'function'){
      playPromise.catch(function(){});
    }
  })();

  /* =========================================================
     2. MATH HELPERS
     ========================================================= */
  function clamp01(x){ return Math.min(1, Math.max(0, x)); }
  function lerp(a,b,t){ return a + (b - a) * t; }
  function smoothstep(e0, e1, x){
    var t = clamp01((x - e0) / (e1 - e0));
    return t * t * (3 - 2 * t);
  }

  /* =========================================================
     3. EMBLEM — single template, cloned everywhere
     ========================================================= */
  function mountEmblem(container){
    var tpl = document.getElementById('emblem-template');
    container.appendChild(tpl.content.cloneNode(true));
  }

  /* =========================================================
     4. PROFILE LIST — virtualized rendering
     ========================================================= */
  var listEl = document.getElementById('profile-list');
  var currentIndex = 0;
  var lastRange = [-1, -1];
  var ITEM_HEIGHT = 98;
  var ITEM_GAP = 14;

  function buildAvatar(profile){
    var wrap = document.createElement('span');
    wrap.className = 'avatar';
    if (profile.image && profile.image !== 'emblem'){
      var img = document.createElement('img');
      img.src = profile.image;
      img.alt = '';
      img.loading = 'lazy';
      img.decoding = 'async';
      img.onerror = function(){
        wrap.innerHTML = '';
        mountEmblem(wrap);
        img.onerror = null;
      };
      wrap.appendChild(img);
    } else {
      mountEmblem(wrap);
    }
    return wrap;
  }

  function buildItem(profile){
    var li = document.createElement('li');
    li.className = 'profile-li';

    var a = document.createElement('a');
    a.className = 'profile-item';
    if (profile.theme){
      a.classList.add('theme-' + profile.theme);
    }
    a.href = profile.url;
    a.setAttribute('aria-label', profile.name);

    if (profile.video){
      a.classList.add('has-bg-video');
      var bgVideo = document.createElement('video');
      bgVideo.className = 'card-bg-video';
      bgVideo.src = profile.video;
      bgVideo.autoplay = true;
      bgVideo.loop = true;
      bgVideo.muted = true;
      bgVideo.defaultMuted = true;
      bgVideo.playsInline = true;
      bgVideo.setAttribute('aria-hidden', 'true');
      a.appendChild(bgVideo);
    }

    a.appendChild(buildAvatar(profile));

    var textWrap = document.createElement('span');
    textWrap.className = 'profile-text';

    var name = document.createElement('span');
    name.className = 'profile-name';
    name.textContent = profile.name;
    textWrap.appendChild(name);

    if (profile.role){
      var role = document.createElement('span');
      role.className = 'profile-role';
      role.textContent = profile.role;
      textWrap.appendChild(role);
    }

    a.appendChild(textWrap);

    var chevron = document.createElement('span');
    chevron.className = 'chevron';
    chevron.setAttribute('aria-hidden', 'true');
    chevron.textContent = '\u203A';
    a.appendChild(chevron);

    a.addEventListener('pointermove', function(e){
      var rect = a.getBoundingClientRect();
      a.style.setProperty('--mx', ((e.clientX - rect.left) / rect.width * 100) + '%');
      a.style.setProperty('--my', ((e.clientY - rect.top) / rect.height * 100) + '%');
    });

    a.addEventListener('touchstart', function(){
      a.classList.add('pressed');
    }, {passive:true});

    a.addEventListener('touchend', function(){
      a.classList.remove('pressed');
    });

    a.addEventListener('touchcancel', function(){
      a.classList.remove('pressed');
    });

    li.appendChild(a);
    return li;
  }

  function estimateIndex(){
    var scrollTop = window.scrollY || document.documentElement.scrollTop || 0;
    var listTop = listEl.getBoundingClientRect().top + scrollTop;
    var rel = Math.max(0, scrollTop - listTop);
    return Math.max(0, Math.floor(rel / (ITEM_HEIGHT + ITEM_GAP)));
  }

  function computeRange(){
    var total = dataSource.length();
    var start = Math.max(0, currentIndex - CONFIG.buffer);
    var end = Math.min(total - 1, currentIndex + CONFIG.buffer);
    return [start, end];
  }

  function measureItemHeight(){
    var li = listEl.querySelector('.profile-li');
    if (li){
      var h = li.getBoundingClientRect().height;
      if (h > 0) ITEM_HEIGHT = h;
    }
  }

  function renderList(force){
    var total = dataSource.length();

    if (total <= 0){
      listEl.innerHTML = '';
      listEl.style.paddingTop = '0px';
      listEl.style.paddingBottom = '0px';
      return;
    }

    var range = computeRange();
    var start = range[0], end = range[1];

    if (!force && start === lastRange[0] && end === lastRange[1]) return;

    lastRange = [start, end];

    listEl.style.paddingTop = (start * (ITEM_HEIGHT + ITEM_GAP)) + 'px';
    listEl.style.paddingBottom = ((total - end - 1) * (ITEM_HEIGHT + ITEM_GAP)) + 'px';

    var frag = document.createDocumentFragment();

    for (var i = start; i <= end; i++){
      frag.appendChild(buildItem(dataSource.get(i)));
    }

    listEl.innerHTML = '';
    listEl.appendChild(frag);
    measureItemHeight();
  }

  var scrollTicking = false;

  window.addEventListener('scroll', function(){
    if (!scrollTicking){
      requestAnimationFrame(function(){
        currentIndex = estimateIndex();
        renderList(false);
        scrollTicking = false;
      });
      scrollTicking = true;
    }
  }, {passive:true});

  window.addEventListener('resize', function(){
    measureItemHeight();
  });

  /* =========================================================
     5. INTRO SEQUENCE
     ========================================================= */
  var introEl = document.getElementById('intro');
  var skipBtn = document.getElementById('skip-btn');
  var appEl = document.getElementById('app');

  function spawnIntroParticles(){
    if (reducedMotion) return;

    var container = document.getElementById('intro-particles');
    var count = 42;

    for (var i = 0; i < count; i++){
      var p = document.createElement('span');
      p.className = 'particle';
      p.style.left = (Math.random() * 100) + '%';
      p.style.top = (Math.random() * 100) + '%';
      p.style.animationDelay = (Math.random() * 2.2) + 's';
      p.style.animationDuration = (2 + Math.random() * 2) + 's';
      container.appendChild(p);
    }
  }

  function finishIntro(){
    introEl.classList.add('fade-out');

    setTimeout(function(){
      if (introEl.parentNode) introEl.parentNode.removeChild(introEl);
      appEl.removeAttribute('aria-hidden');
      renderList(true);
    }, 420);
  }

  function runIntro(){
    var seen = sessionStorage.getItem('alphaIntroSeen');

    if (seen){
      if (introEl.parentNode) introEl.parentNode.removeChild(introEl);
      appEl.removeAttribute('aria-hidden');
      renderList(true);
      return;
    }

    sessionStorage.setItem('alphaIntroSeen', '1');

    mountEmblem(
      document.getElementById('intro-emblem-wrap')
    );

    spawnIntroParticles();

    if (reducedMotion){
      introEl.classList.add('reduced');
    } else {
      introEl.classList.add('animating');
    }

    var duration = reducedMotion ? 700 : 3000;

    var timer = setTimeout(
      finishIntro,
      duration
    );

    skipBtn.addEventListener('click', function(){
      clearTimeout(timer);
      finishIntro();
    });
  }

  /* =========================================================
     6. BOOTSTRAP
     ========================================================= */
  function init(){
    runIntro();
  }

  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
</body>
</html>
